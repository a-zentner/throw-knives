function measure(str, sc = 1){ return str.length * 5 * sc - sc; }

function drawText(str, x, y, col, sc = 1){
  ctx.fillStyle = col;
  let cx = x;
  for(const raw of str.toUpperCase()){
    const g = FONT[raw];
    if(g){
      for(let r = 0; r < 5; r++){
        const row = g[r];
        for(let c = 0; c < 4; c++){
          if(row[c] === '1') ctx.fillRect(cx + c*sc, y + r*sc, sc, sc);
        }
      }
    }
    cx += 4*sc + sc;
  }
}

function drawTextC(str, cx, y, col, sc = 1){
  drawText(str, Math.round(cx - measure(str, sc) / 2), y, col, sc);
}

let actx = null;
function initAudio(){
  if(!actx){
    try{ actx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e){ actx = null; }
  }
  if(actx && actx.state === 'suspended') actx.resume();
}
function beep(freq, dur, type = 'square', vol = 0.05, delay = 0){
  if(!actx) return;
  try{
    const t = actx.currentTime + delay;
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }catch(e){}
}

const logSprite = (() => {
  const S = LOG_R * 2;
  const c = document.createElement('canvas');
  c.width = S; c.height = S;
  const g = c.getContext('2d');
  const cx = LOG_R, cy = LOG_R;

  for(let y = 0; y < S; y++){
    for(let x = 0; x < S; x++){
      const dx = x - cx + 0.5, dy = y - cy + 0.5;
      const d = Math.sqrt(dx*dx + dy*dy);
      if(d > LOG_R) continue;
      let col;
      if(d > LOG_R - 1)      col = '#3a2414';
      else if(d > LOG_R - 4) col = '#6b4226';
      else col = (Math.floor(d / 5) % 2) ? '#9c6a38' : '#8a5a2c';
      g.fillStyle = col;
      g.fillRect(x, y, 1, 1);
    }
  }

  for(let i = 0; i < 6; i++){
    const a0 = i * (TAU / 6) + 0.4;
    for(let rr = 7; rr < LOG_R - 4; rr++){
      const a = a0 + rr * 0.045;
      const px = Math.floor(cx + Math.cos(a) * rr);
      const py = Math.floor(cy + Math.sin(a) * rr);
      g.fillStyle = '#73472a';
      g.fillRect(px, py, 1, 1);
      if(rr % 9 < 4){
        g.fillStyle = '#6b4226';
        g.fillRect(px + 1, py, 1, 1);
      }
    }
  }
  return c;
})();

/* ========================================================
   СИСТЕМА ВРАЩЕНИЯ
   С каждым уровнем паттерн вращения становится сложнее:
   1-3   — простое медленное вращение
   4-6   — ускорение
   7-9   — плавное ускорение/замедление (осцилляция)
   10-12 — осцилляция + короткие паузы
   13-15 — осцилляция + смена направления
   16+   — осцилляция + паузы + смена направления (всё растёт)
======================================================== */
const rot = {
  baseSpeed: 1.05,     // базовая угловая скорость, рад/с
  dir: -1,
  oscAmp: 0,           // амплитуда осцилляции (доля от baseSpeed)
  oscFreq: 0,          // частота осцилляции, Гц
  pauseEvery: 0,       // пауза каждые N секунд
  pauseDur: 0,         // длительность паузы
  pauseTimer: 0,
  pauseLeft: 0,
  flipEvery: 0,        // смена направления каждые N секунд
  flipTimer: 0,
  phase: 0
};

function setupRotation(lvl){
  rot.dir = lvl % 2 === 0 ? 1 : -1;
  rot.phase = Math.random() * TAU;
  rot.oscAmp = 0;
  rot.oscFreq = 0;
  rot.pauseEvery = 0;
  rot.pauseDur = 0;
  rot.flipEvery = 0;
  rot.pauseLeft = 0;

  if(lvl <= 3){
    // Простое медленное вращение
    rot.baseSpeed = 0.9 + lvl * 0.15;
  } else if(lvl <= 6){
    // Ускорение
    rot.baseSpeed = 1.4 + (lvl - 4) * 0.3;
  } else if(lvl <= 9){
    // Плавное ускорение/замедление
    rot.baseSpeed = 1.6 + (lvl - 7) * 0.25;
    rot.oscAmp  = 0.6;
    rot.oscFreq = 0.30 + (lvl - 7) * 0.06;
  } else if(lvl <= 12){
    // Осцилляция + короткие паузы
    rot.baseSpeed = 1.9 + (lvl - 10) * 0.2;
    rot.oscAmp  = 0.4;
    rot.oscFreq = 0.5;
    rot.pauseEvery = 3.5 - (lvl - 10) * 0.3;
    rot.pauseDur   = 0.5;
  } else if(lvl <= 15){
    // Осцилляция + смена направления
    rot.baseSpeed = 2.0 + (lvl - 13) * 0.2;
    rot.oscAmp  = 0.4;
    rot.oscFreq = 0.6;
    rot.flipEvery = 2.5 - (lvl - 13) * 0.2;
  } else {
    // Всё вместе — сложность растёт
    const t = lvl - 15;
    rot.baseSpeed = Math.min(3.5, 2.4 + t * 0.12);
    rot.oscAmp  = Math.min(0.6, 0.4 + t * 0.02);
    rot.oscFreq = Math.min(1.2, 0.5 + t * 0.03);
    rot.pauseEvery = Math.max(2.0, 3.0 - t * 0.08);
    rot.pauseDur   = Math.min(0.6, 0.4 + t * 0.015);
    rot.flipEvery  = Math.max(1.2, 2.5 - t * 0.06);
  }

  rot.pauseTimer = rot.pauseEvery;
  rot.flipTimer  = rot.flipEvery;
}

function updateRotationSpeed(dt){
  // осцилляция фазы идёт всегда (чтобы не было скачков после паузы)
  rot.phase += dt * rot.oscFreq * TAU;

  // пауза
  if(rot.pauseLeft > 0){
    rot.pauseLeft -= dt;
    return 0;
  }
  if(rot.pauseEvery > 0){
    rot.pauseTimer -= dt;
    if(rot.pauseTimer <= 0){
      rot.pauseLeft  = rot.pauseDur;
      rot.pauseTimer = rot.pauseEvery;
      return 0;
    }
  }

  // смена направления
  if(rot.flipEvery > 0){
    rot.flipTimer -= dt;
    if(rot.flipTimer <= 0){
      rot.dir *= -1;
      rot.flipTimer = rot.flipEvery;
    }
  }

  const osc = Math.sin(rot.phase) * rot.oscAmp;
  return rot.baseSpeed * (1 + osc) * rot.dir;
}

/* ========================================================
   ЗАПУСК / ПЕРЕХОД
======================================================== */
function startGame(){
  score = 0;
  level = 1;
  knivesRequired = 7;
  knivesLeft = 7;
  log.angle = Math.random() * TAU;
  setupRotation(1);
  stuck = [];
  flying = [];
  falling = [];
  cooldown = 0;
  shake = 0;
  state = 'playing';
  beep(440, 0.07, 'square', 0.05);
}

function nextLevel(){
  level++;
  knivesRequired = Math.min(12, 6 + level);
  knivesLeft = knivesRequired;
  setupRotation(level);
  log.angle = Math.random() * TAU;
  stuck = [];
  state = 'playing';
}

/* ========================================================
   ДЕЙСТВИЯ
======================================================== */
function throwKnife(){
  if(state !== 'playing') return;
  if(knivesLeft <= 0 || cooldown > 0) return;
  cooldown = 0.09;
  knivesLeft--;
  flying.push({ x: LOG_X, y: KNIFE_SPAWN_Y });
  beep(200, 0.05, 'square', 0.035);
}

function stickKnife(k){
  const phi = Math.PI / 2;
  let rel = ((phi - log.angle) % TAU + TAU) % TAU;

  for(const s of stuck){
    let d = Math.abs(rel - s.rel);
    if(d > Math.PI) d = TAU - d;
    if(d < MIN_ANGLE){
      gameOver(k);
      return;
    }
  }

  stuck.push({ rel });
  score++;
  save.coins++;
  shake = 0.45;
  beep(520 + Math.random() * 60, 0.07, 'square', 0.05);

  if(stuck.length >= knivesRequired) levelClear();
}

function levelClear(){
  state = 'clear';
  stateTimer = 0.95;
  save.coins += 5;
  save.level += 1;
  saveGame();

  beep(660, 0.07, 'square', 0.05);
  beep(880, 0.08, 'square', 0.05, 0.09);
  beep(1180, 0.12, 'square', 0.05, 0.19);

  for(const s of stuck){
    const phi = s.rel + log.angle;
    const px = LOG_X + Math.cos(phi) * (LOG_R + 1);
    const py = LOG_Y + Math.sin(phi) * (LOG_R + 1);
    falling.push({
      x: px, y: py,
      vx: Math.cos(phi) * 130 + (Math.random() - 0.5) * 70,
      vy: Math.sin(phi) * 130 - 110,
      rot: phi - Math.PI / 2,
      vrot: (Math.random() - 0.5) * 12
    });
  }
  stuck = [];
}

function gameOver(k){
  state = 'over';
  stateTimer = 0.65;
  shake = 1.6;
  beep(140, 0.35, 'sawtooth', 0.07);
  saveGame();
  if(k){
    falling.push({
      x: k.x, y: k.y,
      vx: (Math.random() - 0.5) * 120,
      vy: -90,
      rot: 0,
      vrot: (Math.random() - 0.5) * 14
    });
  }
}

/* ========================================================
   ОБНОВЛЕНИЕ
======================================================== */
function update(dt){
  cooldown = Math.max(0, cooldown - dt);
  shake = Math.max(0, shake - dt * 5);

  updateBgStars(dt);

  if(state === 'playing'){
    log.angle += updateRotationSpeed(dt) * dt;
    if(Math.abs(log.angle) > 1000) log.angle %= TAU;
  } else if(state === 'clear'){
    log.angle += 4.0 * dt;
    if(Math.abs(log.angle) > 1000) log.angle %= TAU;
  }

  if(state === 'clear'){
    stateTimer -= dt;
    if(stateTimer <= 0) nextLevel();
  }
  if(state === 'over'){
    stateTimer = Math.max(0, stateTimer - dt);
  }

  // летящие ножи
  for(let i = flying.length - 1; i >= 0; i--){
    const k = flying[i];
    k.y -= KNIFE_SPEED * dt;
    if(k.y <= LOG_Y + LOG_R){
      k.y = LOG_Y + LOG_R;
      flying.splice(i, 1);
      stickKnife(k);
    }
  }

  // падающие ножи
  for(let i = falling.length - 1; i >= 0; i--){
    const f = falling[i];
    f.x += f.vx * dt;
    f.y += f.vy * dt;
    f.vy += 700 * dt;
    f.rot += f.vrot * dt;
    if(f.y > H + 60) falling.splice(i, 1);
  }
}

/* ========================================================
   ОТРИСОВКА МИРА
======================================================== */
function drawBackground(){
  ctx.fillStyle = C.bg;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = C.bg2;
  ctx.fillRect(0, H - 26, W, 26);
  ctx.fillStyle = C.ground;
  ctx.fillRect(0, H - 26, W, 1);
}

function drawWorld(){
  // 1) ВОТКНУТЫЕ НОЖИ — под бревном.
  //    Лезвие полностью скрыто, торчит только рукоять.
  for(const s of stuck){
    const phi = s.rel + log.angle;
    const px = LOG_X + Math.cos(phi) * (LOG_R + 0.5);
    const py = LOG_Y + Math.sin(phi) * (LOG_R + 0.5);
    drawKnife(px, py, phi - Math.PI / 2);
  }

  // 2) ЛЕТЯЩИЕ НОЖИ — тоже под бревном!
  //    Благодаря этому лезвие не «вспыхивает» над деревом,
  //    а плавно скрывается внутрь, как только входит в пень.
  for(const k of flying) drawKnife(k.x, k.y, 0);

  // 3) БРЕВНО — поверх всех лезвий
  ctx.save();
  ctx.translate(LOG_X, LOG_Y);
  ctx.rotate(log.angle);
  ctx.drawImage(logSprite, -LOG_R, -LOG_R);
  ctx.restore();

  // 4) ПАДАЮЩИЕ НОЖИ — поверх бревна (разлёт при зачистке / промахе)
  for(const f of falling) drawKnife(f.x, f.y, f.rot);

  // 5) НОЖ В РУКЕ
  if(state === 'playing' && knivesLeft > 0 && cooldown < 0.05){
    const bob = Math.sin(performance.now() / 190) * 1.6;
    drawKnife(LOG_X, KNIFE_SPAWN_Y + bob, 0);
  }
}

/* ========================================================
   HUD
======================================================== */
function drawHUD(){
  drawText('LV ' + level, 6, 6, C.dim, 1);

  const sc = String(score);
  drawText(sc, W - 6 - measure(sc, 1), 6, C.dim, 1);

  const coinStr = String(save.coins);
  const cw = measure(coinStr, 1);
  drawText(coinStr, W - 6 - cw, 18, C.gold, 1);
  drawCoinIcon(W - 6 - cw - 9, 18);

  if(state === 'playing' || state === 'clear'){
    drawText('X' + knivesLeft, LOG_X + 18, KNIFE_SPAWN_Y - 8, C.dim, 1);
  }
}

/* ========================================================
   ЭКРАНЫ
======================================================== */
function drawMenu(){
  ctx.fillStyle = 'rgba(18,20,31,0.90)';
  ctx.fillRect(0, 0, W, H);

  const t = performance.now() / 1000;

  drawKnife(42, 74, -0.35 + Math.sin(t * 1.2) * 0.06);
  drawKnife(W - 42, 74, 0.35 - Math.sin(t * 1.2) * 0.06);

  drawTextC('THROV', W / 2, 54, C.gold, 4);
  drawTextC('KNIVES',W / 2, 84, C.gold, 4);
  drawTextC('PIXEL', W / 2, 118, C.dim, 2);

  // панель статистики
  const px = 40, py = 160, pw = 160, ph = 26;
  ctx.fillStyle = '#1a1f33';
  ctx.fillRect(px, py, pw, ph);
  ctx.fillStyle = '#3a4160';
  ctx.fillRect(px, py, pw, 1);
  ctx.fillRect(px, py + ph - 1, pw, 1);
  ctx.fillRect(px, py, 1, ph);
  ctx.fillRect(px + pw - 1, py, 1, ph);

  drawText('LVL ' + save.level, px + 10, py + 10, C.text, 1);

  const coinStr = String(save.coins);
  const cw = measure(coinStr, 1);
  const coinX = px + pw - 10 - cw;
  drawText(coinStr, coinX, py + 10, C.gold, 1);
  drawCoinIcon(coinX - 9, py + 10);

  drawButton(menuPlayBtn,  '#365c36', '#5aa35a', '#e6f5e6');
  drawButton(menuStoreBtn, '#36365c', '#5a5aa3', '#e6e6f5');
}

function drawStore(){
  ctx.fillStyle = 'rgba(18,20,31,0.96)';
  ctx.fillRect(0, 0, W, H);

  drawTextC('STORE', W / 2, 26, C.gold, 3);

  const px = 25, py = 78, pw = 190, ph = 140;
  ctx.fillStyle = '#1a1f33';
  ctx.fillRect(px, py, pw, ph);
  ctx.fillStyle = '#3a4160';
  ctx.fillRect(px, py, pw, 1);
  ctx.fillRect(px, py + ph - 1, pw, 1);
  ctx.fillRect(px, py, 1, ph);
  ctx.fillRect(px + pw - 1, py, 1, ph);

  drawButton(storeSkinsBtn,  '#36365c', '#5a5aa3', '#e6e6f5');
  drawButton(storeUpgradesBtn, '#36365c', '#5a5aa3', '#e6e6f5');

  drawButton(storeBackBtn, '#36365c', '#5a5aa3', '#e6e6f5');
}

function drawSkins(){
  ctx.fillStyle = 'rgba(18,20,31,0.96)';
  ctx.fillRect(0, 0, W, H);

  drawTextC('SKINS', W / 2, 26, C.gold, 3);

  const px = 25, py = 78, pw = 190, ph = 180;
  ctx.fillStyle = '#1a1f33';
  ctx.fillRect(px, py, pw, ph);
  ctx.fillStyle = '#3a4160';
  ctx.fillRect(px, py, pw, 1);
  ctx.fillRect(px, py + ph - 1, pw, 1);
  ctx.fillRect(px, py, 1, ph);
  ctx.fillRect(px + pw - 1, py, 1, ph);

  const colX = [px + 55, px + 135];
  const rowY = [py + 30, py + 85, py + 140];

  skinCards = [];

  SKINS.forEach((s, i) => {
    const cx = colX[i % 2];
    const cy = rowY[Math.floor(i / 2)];
    const owned = save.skins.includes(s.name);
    const equipped = save.equippedSkin === s.name;
    const affordable = s.price === null || save.coins >= s.price;

    skinCards.push({ x: cx - 16, y: cy - 16, w: 32, h: 32, index: i });

    ctx.fillStyle = owned ? '#141826' : '#0e111c';
    ctx.fillRect(cx - 16, cy - 16, 32, 32);

    let borderCol = '#2a3150';
    if(equipped) borderCol = C.gold;
    else if(owned) borderCol = '#3a4160';
    else if(!affordable) borderCol = '#1a1f33';

    ctx.fillStyle = borderCol;
    ctx.fillRect(cx - 16, cy - 16, 32, 1);
    ctx.fillRect(cx - 16, cy + 15, 32, 1);
    ctx.fillRect(cx - 16, cy - 16, 1, 32);
    ctx.fillRect(cx + 15, cy - 16, 1, 32);

    const sprite = [knifeSprite, tarantulSprite, paradoxSprite, kilitaSprite, troyaSprite, lovaleSprite][i];

    if(!owned && !affordable){
      ctx.globalAlpha = 0.35;
    }
    ctx.drawImage(sprite, cx - 3, cy - 14);
    ctx.globalAlpha = 1;

    drawTextC(s.name, cx, cy + 19, owned ? C.text : C.dim, 1);

    if(s.price === null){
      drawTextC('FREE', cx, cy + 28, C.green, 1);
    } else if(!owned){
      const coinStr = String(s.price);
      const cw = measure(coinStr, 1);
      const coinW = 6;
      const totalW = coinW + 2 + cw;
      const sx = Math.round(cx - totalW / 2);
      drawCoinIcon(sx, cy + 28);
      drawText(coinStr, sx + coinW + 2, cy + 28, affordable ? C.gold : C.dim, 1);
    } else {
      drawTextC('OWNED', cx, cy + 28, C.green, 1);
    }
  });

  drawButton(skinsBackBtn, '#36365c', '#5a5aa3', '#e6e6f5');
}
function drawUpgrades(){ drawSubStore('UPGRADES', upgradesBackBtn); }

function drawSubStore(title, backBtn){
  ctx.fillStyle = 'rgba(18,20,31,0.96)';
  ctx.fillRect(0, 0, W, H);

  drawTextC(title, W / 2, 26, C.gold, 3);

  const px = 25, py = 78, pw = 190, ph = 140;
  ctx.fillStyle = '#1a1f33';
  ctx.fillRect(px, py, pw, ph);
  ctx.fillStyle = '#3a4160';
  ctx.fillRect(px, py, pw, 1);
  ctx.fillRect(px, py + ph - 1, pw, 1);
  ctx.fillRect(px, py, 1, ph);
  ctx.fillRect(px + pw - 1, py, 1, ph);

  const t = performance.now() / 1000;
  const blink = Math.sin(t * 3) > -0.55 ? 1 : 0.35;
  ctx.globalAlpha = blink;
  drawTextC('В РАЗРАБОТКЕ', W / 2, py + 62, C.gold, 2);
  ctx.globalAlpha = 1;

  drawButton(backBtn, '#36365c', '#5a5aa3', '#e6e6f5');
}

function drawHammer(x, y){
  ctx.fillStyle = '#6b4226';
  ctx.fillRect(x + 2, y + 4, 2, 9);
  ctx.fillStyle = '#a9713a';
  ctx.fillRect(x + 2, y + 4, 1, 9);
  ctx.fillStyle = '#8a95a8';
  ctx.fillRect(x, y, 6, 4);
  ctx.fillStyle = '#eef4fb';
  ctx.fillRect(x, y, 6, 1);
  ctx.fillStyle = '#b6c2d4';
  ctx.fillRect(x, y + 1, 6, 2);
  ctx.fillStyle = '#8a95a8';
  ctx.fillRect(x, y + 3, 6, 1);
}

function drawGameOver(){
  ctx.fillStyle = 'rgba(18,20,31,0.82)';
  ctx.fillRect(0, 0, W, H);

  drawTextC('GAME OVER', W / 2, 96, C.red, 2);
  drawTextC('SCORE ' + score, W / 2, 132, C.text, 2);
  drawTextC('LEVEL ' + level, W / 2, 156, C.dim, 1);

  drawTextC('COINS', W / 2, 176, C.dim, 1);

  drawButton(overRetryBtn, '#365c36', '#5aa35a', '#e6f5e6');
  drawButton(overMenuBtn,  '#36365c', '#5a5aa3', '#e6e6f5');
}

/* ========================================================
   ГЛАВНЫЙ RENDER
======================================================== */
function render(){
  drawBgStars();
  drawBackground();

  if(state === 'menu'){  drawMenu();  return; }
  if(state === 'store'){ drawStore(); return; }
  if(state === 'skins'){ drawSkins(); return; }
  if(state === 'upgrades'){ drawUpgrades(); return; }

  ctx.save();
  if(shake > 0){
    const sx = Math.round((Math.random() - 0.5) * shake * 6);
    const sy = Math.round((Math.random() - 0.5) * shake * 6);
    ctx.translate(sx, sy);
  }
  drawWorld();
  ctx.restore();

  drawHUD();

  if(state === 'clear'){
    drawTextC('LEVEL CLEAR', W / 2, 60, C.gold, 2);
    drawTextC('+5 COINS', W / 2, 80, C.gold, 1);
  }

  if(state === 'over') drawGameOver();
}

/* ========================================================
   ЦИКЛ
======================================================== */
let lastTime = performance.now();
function loop(now){
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if(dt > 0.05) dt = 0.05;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ========================================================
   ВВОД
======================================================== */
function getPointerPos(e){
  const r = cv.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) / r.width  * W,
    y: (e.clientY - r.top ) / r.height * H
  };
}

function onPointer(e){
  if(e.cancelable) e.preventDefault();
  initAudio();
  const p = getPointerPos(e);

  if(state === 'menu'){
    if(hit(menuPlayBtn, p)){  startGame(); return; }
    if(hit(menuStoreBtn, p)){ state = 'store'; return; }
  } else if(state === 'store'){
    if(hit(storeBackBtn, p)){ state = 'menu'; return; }
    if(hit(storeSkinsBtn, p)){ state = 'skins'; return; }
    if(hit(storeUpgradesBtn, p)){ state = 'upgrades'; return; }
  } else if(state === 'skins'){
    for(const c of skinCards){
      if(hit(c, p)){
        const s = SKINS[c.index];
        if(save.skins.includes(s.name)){
          save.equippedSkin = s.name;
        } else if(s.price !== null && save.coins >= s.price){
          save.coins -= s.price;
          save.skins.push(s.name);
          save.equippedSkin = s.name;
          saveGame();
        }
        return;
      }
    }
    if(hit(skinsBackBtn, p)){ state = 'store'; return; }
  } else if(state === 'upgrades'){
    if(hit(upgradesBackBtn, p)){ state = 'store'; return; }
  } else if(state === 'playing'){
    throwKnife();
  } else if(state === 'over'){
    if(stateTimer <= 0){
      if(hit(overRetryBtn, p)){ startGame(); return; }
      if(hit(overMenuBtn, p)){  state = 'menu'; return; }
    }
  }
}

function onKey(e){
  if(e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'Enter'){
    e.preventDefault();
    initAudio();
    if(state === 'menu'){ startGame(); }
    else if(state === 'playing'){ throwKnife(); }
    else if(state === 'store'){ state = 'menu'; }
    else if(state === 'skins'){ state = 'store'; }
    else if(state === 'upgrades'){ state = 'store'; }
    else if(state === 'over' && stateTimer <= 0){ startGame(); }
  }
}

window.addEventListener('pointerdown', onPointer, { passive: false });
window.addEventListener('keydown', onKey);
window.addEventListener('contextmenu', (e) => e.preventDefault());

})();
</script>
